[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ew11-mqtt-analyzer"
version = "0.1.0"
description = "EW11 MQTT packet auto-analysis tool for Korean apartment wallpads (RS485 over EW11 WiFi-serial)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "paho-mqtt==2.1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests",
]

[project.scripts]
ew11-analyzer = "ew11_analyzer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W", "ASYNC", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["ew11_analyzer"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["paho.mqtt.*", "paho.*"]
ignore_missing_imports = true
